SPECIFICATION Spec

CONSTANTS
    Thread = {1, 2}
    Addr = {1, 2, 3, 4, 5, 6, 7, 8}
    CacheLine = {1, 2, 3, 4}
    HashPosition = {1, 2, 3, 4, 5, 6}
    MAX_RETRIES = 2
    MAX_READ_LINES = 3
    MAX_WRITE_LINES = 2

    (* Double-hashing: each cache line maps to 2 hash positions.
       Some overlap to model real bloom filter collisions:
         cl1 → {1,2}   cl2 → {2,3}   cl3 → {4,5}   cl4 → {5,6}  *)
    Hash = [1 |-> {1, 2}, 2 |-> {2, 3}, 3 |-> {4, 5}, 4 |-> {5, 6}]

    (* Address-to-cache-line mapping: 2 addresses per line *)
    CacheLineOf = [1 |-> 1, 2 |-> 1, 3 |-> 2, 4 |-> 2,
                   5 |-> 3, 6 |-> 3, 7 |-> 4, 8 |-> 4]

INVARIANT
    LockFreeInv
    LockOwnerInv
    TSXvsSGLSafety
    BloomContainsReads
    CapacityBounds
    WriteSetConsistent
    NoTSXCommitConflict
    NoSGLTSXOverlap
