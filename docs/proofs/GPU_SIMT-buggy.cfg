\* GPU_SIMT — buggy protocol (Buggy = TRUE).
\* Models the CSMV GPU batch executor BEFORE the 2026-07-31 fixes:
\*   - every lane increments numWrites  -> WriteSetCountOK violated
\*   - ballot executed while diverged   -> NoSyncError violated
\*   - clock += |Lane| per commit       -> ClockMatchesCommits violated
\*
\* TLC stops at the FIRST violated invariant, so to observe each bug
\* individually run with a single INVARIANT:
\*   java -cp /tmp/tla2tools.jar tlc2.TLC -deadlock GPU_SIMT.tla \
\*        -config GPU_SIMT-buggy.cfg -invariant WriteSetCountOK
\* (Use -invariant ClockMatchesCommits / -invariant NoSyncError for the others.)
\*
\* Invariants that must STILL hold in buggy mode (the buggy protocol does not
\* break these) are commented out here so TLC reports the relevant violations.
SPECIFICATION Spec
INVARIANT
    ReadConsistencyOK
    VersionChainMonotonicOK
    ReadSetFreshOK
\*    WriteSetCountOK
\*    ClockMatchesCommits
\*    NoSyncError

CONSTRAINT TLCBound

CONSTANTS
    Warp = {1, 2}
    Lane = {0, 1}
    Addr = {0, 1}
    Value = {0, 1}
    Buggy = TRUE
