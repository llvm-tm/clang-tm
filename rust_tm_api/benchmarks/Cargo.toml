[package]
name = "benchmarks"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bank"
path = "src/bank.rs"

[[bin]]
name = "stmbench7"
path = "src/stmbench7.rs"

[[bin]]
name = "datastructures"
path = "src/datastructures.rs"

[[bin]]
name = "eigenbench"
path = "src/eigenbench.rs"

[[bin]]
name = "stamp"
path = "src/stamp.rs"

[[bin]]
name = "tpcc"
path = "src/tpcc.rs"

[[bin]]
name = "ycsb"
path = "src/ycsb.rs"

[[bin]]
name = "fuzz_counter"
path = "src/fuzz_counter.rs"

[[bin]]
name = "fuzz_bank"
path = "src/fuzz_bank.rs"

[features]
default = ["wbctl"]
wbctl = ["tm/wbctl"]
wbetl = ["tm/wbetl"]
wt    = ["tm/wt"]
norec   = ["tm/norec"]
tl2     = ["tm/tl2"]
swisstm = ["tm/swisstm"]
dudetm  = ["tm/dudetm"]

[dependencies]
tm = { path = "../tm", default-features = false }
fastrand = "2"
