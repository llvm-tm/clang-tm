[package]
name = "benchmarks"
version = "0.1.0"
edition = "2021"

[lib]
name = "benchmarks"
path = "src/lib.rs"

[[bin]]
name = "bank"
path = "src/bin/bank.rs"

[[bin]]
name = "stmbench7"
path = "src/bin/stmbench7.rs"

[[bin]]
name = "datastructures"
path = "src/bin/datastructures.rs"

[[bin]]
name = "eigenbench"
path = "src/bin/eigenbench.rs"

[[bin]]
name = "stamp"
path = "src/bin/stamp.rs"

[[bin]]
name = "tpcc"
path = "src/bin/tpcc.rs"

[[bin]]
name = "ycsb"
path = "src/bin/ycsb.rs"

[[bin]]
name = "fuzz_counter"
path = "src/bin/fuzz_counter.rs"

[[bin]]
name = "fuzz_bank"
path = "src/bin/fuzz_bank.rs"

[features]
default = ["wbctl"]
wbctl = ["tm/wbctl"]
wbetl = ["tm/wbetl"]
wt    = ["tm/wt"]
norec   = ["tm/norec"]
tl2     = ["tm/tl2"]
swisstm = ["tm/swisstm"]
dudetm  = ["tm/dudetm"]
tsxsgl  = ["tm/tsxsgl"]
nvhtm   = ["tm/nvhtm"]
spht    = ["tm/spht"]

[dependencies]
tm = { path = "../tm", default-features = false }
containers = { path = "../containers" }
fastrand = "2"
