name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Job 1: Plugin smoke test (LLVM 22 required; LLVM 23 allow-failure) ─
  plugin-test:
    strategy:
      fail-fast: false
      matrix:
        llvm: [22, 23]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM ${{ matrix.llvm }}
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-${{ matrix.llvm }} main"
          sudo apt-get update
          sudo apt-get install -y llvm-${{ matrix.llvm }}-dev clang-${{ matrix.llvm }} make
          if ! sudo apt-get install -y lld-${{ matrix.llvm }}; then sudo apt-get install -y lld; fi
          llvm-config-${{ matrix.llvm }} --version
      - name: Build plugin (LLVM ${{ matrix.llvm }})
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make plugin
      - name: Build race checker
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make -C plugin race-checker
      - name: Build plugin tests
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make -C plugin test
      - name: Run plugin tests
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make -C plugin run 2>&1
      - name: Verify annotations
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make -C plugin check

  # ── Job 2: Simulator tests ─────────────────────────────
  simulator-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build simulator
        run: cargo build --manifest-path simulator/Cargo.toml
      - name: Run simulator unit tests
        run: cargo test --manifest-path simulator/Cargo.toml
      - name: Generate synthetic trace
        run: simulator/target/debug/tm-gen > /tmp/synth_trace.jsonl
      - name: Synthetic trace fidelity check
        run: python3 simulator/compare_sim.py --sim-only --cargo-profile debug --backends norec,tl2,tinystm,romulus,swisstm,mvlog --trace /tmp/synth_trace.jsonl 2>&1

  # ── Job 3: Rust workspace build ────────────────────────
  rust-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build all Rust workspace members
        run: cargo build --manifest-path explicit_api/rust/workspace/Cargo.toml
      - name: Build all Rust benchmarks
        run: cargo build --manifest-path benchmarks/rust/Cargo.toml
      - name: Run Rust workspace tests
        run: cargo test --manifest-path explicit_api/rust/workspace/Cargo.toml -- --test-threads=1

  # ── Job 4: Race checker warnings ────────────────────────
  race-checker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build plugin (produces .bc files) + race checker
        run: make plugin && make -C plugin race-checker
      - name: Check for race warnings on plugin benchmarks
        run: |
          echo "=== Race checker analysis ==="
          cd plugin
          for bc in out/*.bc; do
            [ -f "$bc" ] || continue
            name=$(basename "$bc" .bc)
            warnings=$(opt-22 -load-pass-plugin=bin/libTMRaceChecker.so \
              -passes="tm-race-checker" "$bc" -o /dev/null 2>&1 | \
              grep -c "suggest" || true)
            echo "  $name: $warnings warning(s)"
          done

  # ── Job 5: Cross-backend correctness (PRs + push to main) ─
  cross-backend:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build and test backends
        run: |
          # PRs gate on 3 core backends (fast); push to main tests all.
          if [ "${{ github.event_name }}" = "push" ]; then
            BACKENDS="TINYSTM WBETL WT NOREC NORECBF SWISSTM TL2 TSC_TM MVLOG SGL XTM LEFTRIGHT ROMULUS"
          else
            BACKENDS="TINYSTM NOREC TL2"
          fi
          for backend in $BACKENDS; do
            if ! make -C benchmarks/cpp -j4 bin/test_tx bin/test_ds BACKEND=$backend; then
              echo "BUILD FAILED: $backend"
              exit 1
            fi
            tx_pass=$(./benchmarks/cpp/bin/test_tx 2>&1 | grep -c "ALL.*PASSED" || true)
            ds_pass=$(./benchmarks/cpp/bin/test_ds 2>&1 | grep -c "ALL.*PASSED" || true)
            echo "=== $backend: test_tx=$tx_pass test_ds=$ds_pass ==="
            [ "$tx_pass" -ge 1 ] || { echo "CROSS-BACKEND FAIL (test_tx): $backend"; exit 1; }
            [ "$ds_pass" -ge 1 ] || { echo "CROSS-BACKEND FAIL (test_ds): $backend"; exit 1; }
          done

  # ── Job 6: Stale directory check ────────────────────────
  stale-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify stale directories have been removed
        run: |
          all_clean=true
          for dir in llvm_tm_plugin expli-benchmarks plugin-benchmarks rust_tm_api; do
            if [ -d "$dir" ]; then
              echo "STALE: $dir still exists — should have been deleted"
              all_clean=false
            fi
          done
          $all_clean && echo "All stale directories removed ✓"

  # ── Job 7: TLA+ model checking ─────────────────────────────
  tla-plus-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Python 3.10+
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install TLA+ tools
        run: |
          curl -sSLo /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          java -cp /tmp/tla2tools.jar tlc2.TLC -help 2>&1 | head -1 || true
      - name: Run TLC model checking
        run: |
          for tla in docs/proofs/*.tla; do
            echo "Checking $tla..."
            java -cp /tmp/tla2tools.jar tlc2.TLC -deadlock -workers 4 "$tla" || true
          done
      - name: Publish TLC results
        uses: actions/upload-artifact@v5
        with:
          name: tla-results
          path: docs/proofs/*/mch*

  # ── Job 8: TLA+ smoke gate (3 small models, blocking, <5 min) ─
  tla-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Download tla2tools.jar
        run: curl -sSLo /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: TLC smoke check (3 small models, 60s timeout each)
        run: make -C docs/proofs smoke-check

  # ── Job 9: Format + lint gate (clang-format + rustfmt + clippy) ─
  lint:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format-22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-22 make
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python tool dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Compile Python tools
        run: python3 -m compileall -q tools plugin simulator patches benchmarks gem5_sim
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting + clippy
        run: make fmt-check

  # ── Job 10: ASan/UBSan correctness gate (PRs + main) ─
  sanitizer:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        backend: [NOREC, TL2]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build sanitized bank (${{ matrix.backend }})
        run: make -C benchmarks/cpp bin/bank BACKEND=${{ matrix.backend }} SANITIZE=address
      - name: Run sanitized bank (${{ matrix.backend }})
        run: ./benchmarks/cpp/bin/bank -t 4 -d 1000
      - name: Build sanitized test_tx/test_ds (${{ matrix.backend }})
        run: make -C benchmarks/cpp bin/test_tx bin/test_ds BACKEND=${{ matrix.backend }} SANITIZE=address
      - name: Run sanitized test_tx/test_ds (${{ matrix.backend }})
        run: |
          ./benchmarks/cpp/bin/test_tx
          ./benchmarks/cpp/bin/test_ds
