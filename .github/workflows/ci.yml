name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Job 1: Plugin smoke test (LLVM 22 required; LLVM 23 allow-failure) ─
  plugin-test:
    strategy:
      fail-fast: false
      matrix:
        llvm: [22, 23]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM ${{ matrix.llvm }}
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-${{ matrix.llvm }} main"
          sudo apt-get update
          sudo apt-get install -y llvm-${{ matrix.llvm }}-dev clang-${{ matrix.llvm }} make
          if ! sudo apt-get install -y lld-${{ matrix.llvm }}; then sudo apt-get install -y lld; fi
          llvm-config-${{ matrix.llvm }} --version
      - name: Build plugin (LLVM ${{ matrix.llvm }})
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make plugin
      - name: Build race checker
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make -C plugin race-checker
      - name: Build plugin tests
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make -C plugin test
      - name: Run plugin tests
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make -C plugin run 2>&1
      - name: Verify annotations
        continue-on-error: ${{ matrix.llvm != 22 }}
        run: LLVM_VERSION=${{ matrix.llvm }} make -C plugin check

  # ── Job 2: Simulator tests ─────────────────────────────
  simulator-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build simulator
        run: cargo build --manifest-path simulator/Cargo.toml
      - name: Run simulator unit tests
        run: cargo test --manifest-path simulator/Cargo.toml
      - name: Generate synthetic trace
        run: simulator/target/debug/tm-gen > /tmp/synth_trace.jsonl
      - name: Synthetic trace fidelity check
        run: python3 simulator/compare_sim.py --sim-only --cargo-profile debug --backends norec,tl2,tinystm,romulus,swisstm,mvlog --trace /tmp/synth_trace.jsonl 2>&1

  # ── Job 3: Rust workspace build ────────────────────────
  rust-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build all Rust workspace members
        run: cargo build --manifest-path explicit_api/rust/workspace/Cargo.toml
      - name: Build all Rust benchmarks
        run: cargo build --manifest-path benchmarks/rust/Cargo.toml
      - name: Run Rust workspace tests
        run: cargo test --manifest-path explicit_api/rust/workspace/Cargo.toml -- --test-threads=1
      # review-05 R-12: bench-tinystm and containers were only green via
      # workspace feature unification; gate each backend combo explicitly.
      - name: bench-tinystm compiles with every backend feature
        run: |
          for f in wbctl wbetl wt norec tl2; do
            cargo check --manifest-path explicit_api/rust/workspace/Cargo.toml \
              -p bench-tinystm --no-default-features --features $f
          done
      - name: containers standalone check
        run: cargo check --manifest-path explicit_api/rust/workspace/Cargo.toml -p containers

  # ── Job 4: Race checker warnings ────────────────────────
  race-checker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build plugin + race checker (tests compile the .bc inputs)
        run: make plugin && make -C plugin test && make -C plugin race-checker
      - name: Assert plugin/out/ has .bc files before scanning
        run: |
          shopt -s nullglob
          bc=(plugin/out/*.bc)
          echo "found ${#bc[@]} .bc file(s) under plugin/out/"
          if [ "${#bc[@]}" -eq 0 ]; then
            echo "FAIL: plugin build produced no .bc files under plugin/out/"
            exit 1
          fi
      - name: Check for race warnings on plugin benchmarks
        run: |
          echo "=== Race checker analysis ==="
          cd plugin
          shopt -s nullglob
          for bc in out/*.bc; do
            name=$(basename "$bc" .bc)
            warnings=$(opt-22 -load-pass-plugin=bin/libTMRaceChecker.so \
              -passes="tm-race-checker" "$bc" -o /dev/null 2>&1 | \
              grep -c "suggest" || true)
            echo "  $name: $warnings warning(s)"
          done

  # ── Job 5: Cross-backend correctness (PRs + push to main) ─
  cross-backend:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build and test backends
        run: |
          # PRs gate on 3 core backends (fast); push to main tests all.
          if [ "${{ github.event_name }}" = "push" ]; then
            BACKENDS="TINYSTM WBETL WT NOREC NORECBF SWISSTM TL2 TSC_TM MVLOG SGL XTM LEFTRIGHT ROMULUS ACCELTL2 CSMV GPU_STM_CPU JVSTM"
          else
            BACKENDS="TINYSTM NOREC TL2"
          fi
          for backend in $BACKENDS; do
            if ! make -C benchmarks/cpp -j4 bin/test_tx bin/test_ds BACKEND=$backend; then
              echo "BUILD FAILED: $backend"
              exit 1
            fi
            tx_pass=$(./benchmarks/cpp/bin/test_tx 2>&1 | grep -c "ALL.*PASSED" || true)
            ds_pass=$(./benchmarks/cpp/bin/test_ds 2>&1 | grep -c "ALL.*PASSED" || true)
            echo "=== $backend: test_tx=$tx_pass test_ds=$ds_pass ==="
            [ "$tx_pass" -ge 1 ] || { echo "CROSS-BACKEND FAIL (test_tx): $backend"; exit 1; }
            [ "$ds_pass" -ge 1 ] || { echo "CROSS-BACKEND FAIL (test_ds): $backend"; exit 1; }
          done

  # ── Job 5b: Differential concurrency driver ─────────────
  # Runs the self-verifying T1 driver (tests/concurrency/drv_diff_ops.cpp)
  # plus the sub-word/bucket-aliasing repros across backends. Catches lost
  # updates / version-store aliasing the functional test_tx/test_ds cannot.
  # All listed backends pass cleanly on the seeded scenarios (verified locally
  # across seeds 1-8 incl. high-contention configs); any nonzero counter fails.
  diff-concurrency:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Run differential concurrency sweep
        run: |
          # Seed 1 deterministically catches the aliasing/width class these
          # fixes addressed; the backends here include every one the driver
          # has caught a bug in (CSMV, JVSTM, GPU_STM_CPU, MVLOG, GPUTX) plus
          # core references. GPUTX's §35 lost update only showed at 16+ threads,
          # which is why the sweep below also runs a -T 16 leg.
          # tools/diff_backends.sh also runs single-op-class (-M) and per-thread
          # partitioned (-R) shapes at enough slots to cross MVLog's reclamation
          # threshold: the mixed shape at a smaller slot count passed right over
          # the §34 lost update, and neither shape is reachable below that.
          if [ "${{ github.event_name }}" = "push" ]; then
            BACKENDS="TINYSTM NOREC NORECBF SWISSTM TL2 MVLOG SGL LEFTRIGHT XTM CSMV GPU_STM_CPU JVSTM GPUTX" \
              tools/diff_backends.sh 1
          else
            BACKENDS="TL2 NOREC SGL CSMV GPU_STM_CPU JVSTM" \
              tools/diff_backends.sh 1
          fi

  # ── Job 5c: Per-backend unit suite ──────────────────────
  # Deterministic, fast (each test ~ms) correctness checks compiled directly
  # against each runtime: counter_st/mt, write_set_validation, overlap_stress,
  # read_lock_interference, readall_write_interference, abba_deadlock,
  # subword_counters, plus the region-allocator tests. This is the gate that
  # catches version-store aliasing and sub-word clobbering without relying on
  # the stochastic concurrency driver. All 12 backends pass locally (MVLog joins
  # it here; its one exclusion, test_gc_reader, is recorded with its reason in
  # tests/backends/tm_impl/Makefile).
  backend-unit:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build and run all backend unit tests
        run: |
          make -C tests/backends/tm_impl -j4 all
          make -C tests/backends/tm_impl run

  # ── Job 6: Stale directory check ────────────────────────
  stale-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify stale directories have been removed
        run: |
          all_clean=true
          for dir in llvm_tm_plugin expli-benchmarks plugin-benchmarks rust_tm_api; do
            if [ -d "$dir" ]; then
              echo "STALE: $dir still exists — should have been deleted"
              all_clean=false
            fi
          done
          $all_clean && echo "All stale directories removed ✓"

  # ── Job 8: TLA+ smoke gate (3 small models, blocking, <5 min) ─
  tla-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Download tla2tools.jar
        run: curl -sSLo /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: TLC smoke check (3 small models, 60s timeout each)
        run: make -C docs/proofs smoke-check

  # ── Job 9: Format + lint gate (clang-format + rustfmt + clippy) ─
  lint:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format-22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y clang-format-22 make
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python tool dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Compile Python tools
        run: python3 -m compileall -q tools plugin simulator patches benchmarks gem5_sim
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting + clippy
        run: make fmt-check

  # ── Job 10: ASan/UBSan correctness gate (PRs + main) ─
  sanitizer:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        # AddressSanitizer's memory-error checks run for every backend: none of
        # them reports one on bank/test_tx/test_ds (verified locally, 2026-11-26).
        # LeakSanitizer is per-backend, because several backends hold allocations
        # that are only ever reclaimed by the OS at process exit; those are listed
        # in TODO.md with a fix design, and flip into leak_check: true as each is
        # fixed. Do not disable leaks globally again - that hid a real one.
        backend:
          - TINYSTM
          - WBETL
          - WT
          - NOREC
          - NORECBF
          - SWISSTM
          - TL2
          - TSC_TM
          - MVLOG
          - SGL
          - LEFTRIGHT
          - ROMULUS
          - XTM
          - SPHT
          - TSXSGL
          - GPU_STM_CPU
          - CSMV
          - JVSTM
          - GACCO
          - CALVIN
          - GPUTX
        leak_check: [false]
        include:
          # Leak-clean on bank + test_tx + test_ds under detect_leaks=1, measured
          # per backend. Everything else leaks at exit and is listed in TODO.md
          # under the three known sources (the bank harness's own executor/future
          # objects, backend metadata never released, and JVSTM's absence of
          # version reclamation) - fix the owner, then add it here.
          - backend: NOREC
            leak_check: true
          - backend: NORECBF
            leak_check: true
          - backend: TL2
            leak_check: true
          - backend: MVLOG
            leak_check: true
          - backend: CSMV
            leak_check: true
          - backend: SGL
            leak_check: true
          - backend: GACCO
            leak_check: true
          - backend: GPUTX
            leak_check: true
          - backend: TSC_TM
            leak_check: true
          - backend: TSXSGL
            leak_check: true
          - backend: GPU_STM_CPU
            leak_check: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=${{ matrix.leak_check && 1 || 0 }}
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build sanitized bank (${{ matrix.backend }})
        run: make -C benchmarks/cpp bin/bank BACKEND=${{ matrix.backend }} SANITIZE=address
      - name: Run sanitized bank (${{ matrix.backend }})
        run: ./benchmarks/cpp/bin/bank -t 4 -d 1000
      - name: Build sanitized test_tx/test_ds (${{ matrix.backend }})
        run: make -C benchmarks/cpp bin/test_tx bin/test_ds BACKEND=${{ matrix.backend }} SANITIZE=address
      - name: Run sanitized test_tx/test_ds (${{ matrix.backend }})
        run: |
          ./benchmarks/cpp/bin/test_tx
          ./benchmarks/cpp/bin/test_ds


  # ── Job 10b: TSan race gate (race-clean backends) ─────────
  # Every C++ backend in the tree is gated: all of them report zero
  # ThreadSanitizer warnings on the T1 differential driver, and the driver exits
  # non-zero on any consistency violation, so a race or anomaly introduced into
  # any backend now fails the PR. ACCELTL2 is gated on its CPU path (see the
  # TM_ACCEL_DISABLE comment below); its device-backed SVM path needs a machine
  # with a real IGP and stays in the non-blocking nightly sweep. When a backend
  # regresses, docs/CORRECTNESS_FIXES.md's known-issues table and the triage
  # table in TODO.md say where the pattern usually is.
  tsan-gate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        backend:
          - SGL
          - JVSTM
          - CSMV
          - TL2
          - TINYSTM
          - WT
          - WBETL
          - NOREC
          - NORECBF
          - LEFTRIGHT
          - ROMULUS
          - MVLOG
          - SWISSTM
          - TSC_TM
          - XTM
          - TSXSGL
          - SPHT
          - GPU_STM_CPU
          - ACCELTL2
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      # The symbolizer is left to TSan's default; if a race ever appears, the
      # follow-up step resolves the reported offsets with addr2line so the log is
      # still readable.
      TSAN_OPTIONS: halt_on_error=0:detect_deadlocks=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build TSan differential driver (${{ matrix.backend }})
        run: make -C benchmarks/cpp bin/drv_diff_ops BACKEND=${{ matrix.backend }} SANITIZE=thread
      - name: Run TSan differential driver (${{ matrix.backend }})
        # ACCELTL2 is gated on its CPU path: the OpenCL ICD the accelerator
        # probe dlopens spawns its own (uninstrumented) worker threads and
        # allocates through them, which ThreadSanitizer reports as races and a
        # thread leak that no backend code can fix. With the probe disabled the
        # backend is race-clean; the device-backed SVM path is exercised only on
        # accelerator-enabled hosts, never here.
        env:
          TM_ACCEL_DISABLE: ${{ matrix.backend == 'ACCELTL2' && '1' || '0' }}
        run: |
          set -o pipefail
          ./benchmarks/cpp/bin/drv_diff_ops -S 1 -T 4 -n 200 2>&1 | tee /tmp/tsan-run.log
      - name: Run TSan differential driver (${{ matrix.backend }}, server-commit mode)
        if: matrix.backend == 'CSMV'
        # CPU model of the GPU block-0 server commit: one global lock serialises
        # each validate -> assign-ts -> install sequence (see the runtime).
        run: |
          set -o pipefail
          CSMV_SERVER_COMMIT=1 ./benchmarks/cpp/bin/drv_diff_ops -S 1 -T 4 -n 200 2>&1 \
            | tee -a /tmp/tsan-run.log
      - name: Symbolise any race report
        if: failure()
        run: |
          # Best effort: TSan's external symbolizer is unreliable in CI images, so
          # resolve the reported "drv_diff_ops+0x…" offsets with addr2line here.
          BIN=benchmarks/cpp/bin/drv_diff_ops
          grep -oE 'drv_diff_ops\+0x[0-9a-f]+' /tmp/tsan-run.log 2>/dev/null |
            sed 's/.*+0x//' | sort -u | while read -r off; do
              printf '0x%s  ' "$off"
              addr2line -f -C -e "$BIN" "0x$off" | head -2 | tr '\n' ' '
              echo
            done

  # ── Job 11: UBSan gate (every backend) ──────────────────────
  # UndefinedBehaviorSanitizer over the T1 differential driver, per backend. Cheap
  # (no shadow memory) and it catches what the race gate cannot: hooks registered
  # through a mismatched function-pointer type - invisible to the compiler behind
  # the explicit cast used at the registration site - and pointer arithmetic on a
  # null slab base. Both were live in this tree until 2026-11-26; see
  # docs/CORRECTNESS_FIXES.md §33.
  ubsan-gate:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        backend:
          - TINYSTM
          - WBETL
          - WT
          - NOREC
          - NORECBF
          - SWISSTM
          - TL2
          - TSC_TM
          - MVLOG
          - SGL
          - LEFTRIGHT
          - ROMULUS
          - XTM
          - SPHT
          - TSXSGL
          - GPU_STM_CPU
          - CSMV
          - JVSTM
          - GACCO
          - CALVIN
          - ACCELTL2
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      # print_stacktrace=0 because UBSan forks llvm-symbolizer, and on images
      # where that binary fails the report is lost and the exit status becomes
      # 141 (SIGPIPE), which reads as an unexplained failure. Resolve offsets
      # offline with addr2line instead (docs/DEBUGGING_BACKENDS.md §4).
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=0
    steps:
      - uses: actions/checkout@v5

      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make

      - name: Build UBSan differential driver (${{ matrix.backend }})
        run: make -C benchmarks/cpp bin/drv_diff_ops BACKEND=${{ matrix.backend }} SANITIZE=undefined

      - name: Run UBSan differential driver (${{ matrix.backend }})
        run: |
          set -o pipefail
          ./benchmarks/cpp/bin/drv_diff_ops -S 1 -T 8 -n 1000 2>&1 | tee /tmp/ubsan-run.log

      - name: Fail on any undefined behaviour
        run: |
          n=$(grep -c 'runtime error:' /tmp/ubsan-run.log || true)
          echo "UBSan runtime errors: $n"
          if [ "$n" -ne 0 ]; then
            grep 'runtime error:' /tmp/ubsan-run.log | head -20
            exit 1
          fi

  # ── Job 12: Markdown link integrity (relative links only) ─
  md-links:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check markdown relative links resolve
        run: |
          python3 - <<'PY'
          import re, os, sys, pathlib
          root = pathlib.Path('.').resolve()
          mds = [root/'README.md', root/'AGENTS.md', root/'CONTRIBUTING.md',
                 root/'SECURITY.md', root/'TODO.md', root/'CHANGELOG.md',
                 root/'BOOK_REPO_INTEGRATION_PLAN.md']
          mds += list((root/'docs').glob('**/*.md'))
          bad = []; total = 0
          for md in mds:
              if not md.exists(): continue
              real = pathlib.Path(os.path.realpath(md))   # follow symlink (docs/AGENTS.md)
              text = real.read_text(errors='replace')
              for m in re.finditer(r'\[[^\]]+\]\(([^)\s]+)(?:\s+"[^"]*")?\)', text):
                  link = m.group(1)
                  if re.match(r'^([a-z]+:|mailto:|/|#)', link): continue
                  path = link.split('#', 1)[0]
                  if not path: continue
                  total += 1
                  if (real.parent / path).resolve().exists(): continue
                  bad.append(f'{md.relative_to(root)}: {link}')
          print(f'markdown relative links checked: {total}; broken: {len(bad)}')
          for b in bad: print(' ', b)
          sys.exit(1 if bad else 0)
          PY
          echo "=== md-links: all relative links resolve ==="


  # ── Job 13: Plugin benchmark build (would have caught B-01..B-07, B-22..B-28) ──
  plugin-benchmarks-build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: plugin-test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 make
          if ! sudo apt-get install -y lld-22; then sudo apt-get install -y lld; fi
      - name: Build plugin
        run: make plugin
      - name: Build plugin benchmarks (skip stmbench7/STAMP until B-07/B-27/B-29 land)
        run: |
          set -e
          for d in bank datastructures eigenbench intset tpcc ycsb deathstarbench; do
            echo "=== make -C benchmarks/plugin/$d ==="
            make -C benchmarks/plugin/$d -j$(nproc)
          done
      - name: Smoke-run a few benchmark targets
        run: |
          set -e
          ./benchmarks/plugin/bank/bin/bank_singlelock -t 2 -d 500 --test
          ./benchmarks/plugin/bank/bin/bank_norec     -t 2 -d 500 --test
          ./benchmarks/plugin/bank/bin/bank_tinystm   -t 2 -d 500 --test
          # NOTE: bank_tl2 --test is intentionally NOT run here; it is B-21
          # (TL2 plugin-mode money drift). See review-04/BUGS.md B-21.

  # ── Job 14: Backend header compiles under LLVM_TM_PLUGIN (would have caught B-01) ──
  header-compiles:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: plugin-test
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 make
      - name: Compile every backend header standalone under -DLLVM_TM_PLUGIN
        run: |
          set -e
          TMP=$(mktemp -d)
          COMMON=backends/tm_impl/common
          REG=backends/tm_impl/tm_region_allocator
          # Reuse the same C++ compiler + gcc-install-dir auto-detect that
          # benchmarks/cpp/Makefile uses, so this job works on any box where
          # check-fast passes.
          CXX=$(command -v clang++-22 2>/dev/null || command -v clang++-18 2>/dev/null \
             || command -v clang++-17 2>/dev/null || command -v clang++-16 2>/dev/null \
             || command -v clang++-15 2>/dev/null || command -v clang++-14 2>/dev/null \
             || command -v clang++ 2>/dev/null || echo g++)
          GCCFIX=""
          if echo "$CXX" | grep -q clang++; then
            if [ ! -d /usr/include/c++/16 ]; then
              if [ -d /usr/lib/gcc/x86_64-linux-gnu/15 ]; then
                GCCFIX="--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/15"
              elif [ -d /usr/lib/gcc/x86_64-linux-gnu/12 ]; then
                GCCFIX="--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/12"
              fi
            fi
          fi
          echo "=== header-compiles: using CXX=$CXX GCCFIX=$GCCFIX ==="
          STUBS=backends/stubs
          PASS=0; FAIL=0; SKIP=0
          # Allow-list: headers that cannot be standalone-compiled by design
          # (e.g. require a DESIGN_* macro). Update as fixes land.
          ALLOW="
            backends/tm_impl/tiny_stm/tinystm_globals.hpp
            backends/tm_impl/queue/queue_runtime.hpp
            backends/tm_impl/tsc_tm/tsc_tm_base.hpp
          "
          for h in backends/tm_impl/*/*.hpp; do
            dir=$(dirname "$h")
            case "$dir" in
              "$COMMON"|"$REG") continue ;;
            esac
            skip=0
            for a in $ALLOW; do
              if [ "$h" = "$a" ]; then SKIP=$((SKIP+1)); skip=1; break; fi
            done
            [ $skip = 1 ] && continue
            cat > "$TMP/tu.cpp" << TU
          #include "$PWD/$h"
          int main() { return 0; }
          TU
            if "$CXX" -std=c++20 -DLLVM_TM_PLUGIN \
               $GCCFIX \
               -I"$PWD/$COMMON" -I"$PWD/$dir" -I"$PWD/$STUBS" \
               -c "$TMP/tu.cpp" -o "$TMP/tu.o" 2>"$TMP/err"; then
              PASS=$((PASS+1))
            else
              echo "=== FAIL: $h ==="
              head -20 "$TMP/err"
              FAIL=$((FAIL+1))
            fi
          done
          echo "header-compiles: $PASS pass, $FAIL fail, $SKIP skipped"
          [ "$FAIL" = 0 ]

  # ── Job 15: macOS portability gate (Mach-O link + arm64) ──
  # Before this job, CI was Linux-only and silently missed two classes of
  # breakage: the Mach-O weak-symbol link failure in tm_region_allocator.cpp
  # and the explicit-API-only regressions (e.g. the realloc over-read). No LLVM
  # install is needed — the explicit API uses the platform clang only.
  macos-portability:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          clang++ --version
          uname -m
      - name: Build + run explicit-API tests (Mach-O link gate)
        run: |
          set -e
          for b in NOREC TINYSTM TL2; do
            echo "=== $b ==="
            make -C benchmarks/cpp -j4 bin/test_tx bin/test_ds BACKEND=$b
            ./benchmarks/cpp/bin/test_tx | tee /tmp/tx.out | tail -1
            ./benchmarks/cpp/bin/test_ds | tee /tmp/ds.out | tail -1
            grep -qE "ALL [0-9]+ tests PASSED" /tmp/tx.out
            grep -qE "ALL [0-9]+ tests PASSED" /tmp/ds.out
          done

  # ── Job 16: Fuzz smoke (libFuzzer, short) ─────────────────
  fuzz-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install clang (libFuzzer runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make
      - name: Build fuzz targets
        run: make -C tests/fuzz -j2 CXX=clang++
      - name: Run fuzz targets (30s each)
        run: |
          ./tests/fuzz/test_tx_fuzzer -max_total_time=30 -print_final_stats
          ./tests/fuzz/test_ds_fuzzer -max_total_time=30 -print_final_stats
