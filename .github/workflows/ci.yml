name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make

      - name: Build plugin
        run: make plugin

      - name: Build race checker
        run: make -C plugin race-checker

      - name: Build expli C++ benchmarks (NOREC)
        run: |
          echo "=== Compilers available ==="
          echo "clang++-22: $(which clang++-22 2>/dev/null || echo NOT FOUND)"
          echo "clang++-14: $(which clang++-14 2>/dev/null || echo NOT FOUND)"
          echo "clang++: $(which clang++ 2>/dev/null || echo NOT FOUND)"
          echo "g++: $(which g++ 2>/dev/null || echo NOT FOUND)"
          echo "c++: $(which c++ 2>/dev/null || echo NOT FOUND)"
          echo "=== Trying direct compile ==="
          cd benchmarks/cpp
          clang++-22 --version 2>&1 | head -1
          clang++-22 -std=c++20 -O3 -DNDEBUG \
            -I../.. -I../../expli_instr/cpp \
            -I../../backends/tm_impl/common \
            -I../../backends/tm_impl/norec \
            -DTM_BACKEND_NOREC \
            -o bin/test_tx \
            ../../tests/expli-api/test_tx.cpp \
            ../../backends/tm_impl/norec/NOrec_runtime.cpp \
            ../../backends/tm_impl/tm_region_allocator/tm_region_allocator.cpp \
            ../../backends/tm_impl/common/tm_hooks.cpp \
            -pthread 2>&1
          rc=$?
          echo "=== Direct compile exit code: $rc ==="
          exit $rc

      - name: Run expli C++ tests (NOREC)
        run: |
          ./benchmarks/cpp/bin/test_tx
          ./benchmarks/cpp/bin/test_ds

      - name: Build plugin tests
        run: make -C plugin test

      - name: Run plugin tests
        run: make -C plugin run

      - name: Verify annotations
        run: make -C plugin check
