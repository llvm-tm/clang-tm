name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 22
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make

      - name: Build plugin
        run: make plugin

      - name: Build race checker
        run: make -C plugin race-checker

      - name: Build expli C++ benchmarks (NOREC)
        run: |
          echo "=== Finding compiler ==="
          CXX=$(command -v clang++-22 || command -v clang++-18 || command -v clang++-17 || command -v clang++-16 || command -v clang++-15 || command -v clang++-14 || command -v clang++ || echo g++)
          echo "CXX=$CXX"
          $CXX --version 2>&1 | head -1
          echo "=== Test compile trivial program ==="
          cat > /tmp/test_trivial.cpp << 'EOF'
          #include <csetjmp>
          #include <setjmp.h>
          int main() {
            sigjmp_buf buf;
            sigsetjmp(buf, 0);
            return 0;
          }
          EOF
          $CXX -std=c++20 -c /tmp/test_trivial.cpp -o /tmp/test_trivial.o 2>&1
          echo "trivial compile: $?"
          echo "=== make build ==="
          make -C benchmarks/cpp -j4 bin/test_tx bin/test_ds BACKEND=NOREC 2>&1
          echo "make exit: $?"

      - name: Run expli C++ tests (NOREC)
        run: |
          ./benchmarks/cpp/bin/test_tx
          ./benchmarks/cpp/bin/test_ds

      - name: Build plugin tests
        run: make -C plugin test

      - name: Run plugin tests
        run: make -C plugin run

      - name: Verify annotations
        run: make -C plugin check
