name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'      # daily: fidelity + cross-backend
    - cron: '0 5 * * 0'      # weekly (Sun): + post-merge verification (S31)

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Fidelity regression: compare real C++ vs simulator ──
  fidelity-regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build simulator (release)
        run: cargo build --release --manifest-path simulator/Cargo.toml
      - name: Build C++ benchmarks for 3 sim backends
        run: |
          for backend in NOREC TL2 TINYSTM; do
            make -C benchmarks/cpp -j4 BACKEND=$backend
          done
      - name: Run comparison
        run: |
          python3 simulator/compare_real_sim.py \
            --backends NOREC,TL2,TINYSTM \
            --benchmarks bank,vacation,kmeans \
            --csv nightly_results.csv 2>&1
      - name: Fidelity gate (fail if avg fidelity < 50%)
        run: |
          python3 -c "
          import csv, sys
          with open('nightly_results.csv') as f:
              reader = csv.DictReader(f)
              fidelities = [float(r['Fidelity'].rstrip('%')) for r in reader
                            if r['Fidelity'] not in ('N/A', '')]
              if not fidelities:
                  print('No fidelity data found')
                  sys.exit(0)
              avg = sum(fidelities) / len(fidelities)
              print(f'Average fidelity: {avg:.1f}%')
              if avg < 50.0:
                  print(f'FAIL: fidelity {avg:.1f}% < 50% threshold')
                  sys.exit(1)
              print('PASS')
          "
      - name: Upload fidelity results
        uses: actions/upload-artifact@v5
        with:
          name: fidelity-results
          path: nightly_results.csv

  # ── Cross-backend full sweep ────────────────────────────
  cross-backend-full:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build and test all 10 backends
        run: |
          echo "backend,test_tx,test_ds" > cross_backend_results.csv
          for backend in TINYSTM WBETL WT NOREC SWISSTM TL2 SGL XTM LEFTRIGHT ROMULUS; do
            make -C benchmarks/cpp -j4 bin/test_tx bin/test_ds BACKEND=$backend 2>/dev/null
            ./benchmarks/cpp/bin/test_tx > /dev/null 2>&1 && tx="PASS" || tx="FAIL"
            ./benchmarks/cpp/bin/test_ds > /dev/null 2>&1 && ds="PASS" || ds="FAIL"
            echo "$backend,$tx,$ds" >> cross_backend_results.csv
          done
          cat cross_backend_results.csv
      - name: Upload cross-backend results
        uses: actions/upload-artifact@v5
        with:
          name: cross-backend-results
          path: cross_backend_results.csv

  # ── Post-merge verification (S31): full matrix, weekly (Sunday) ────────
  post-merge-check:
    if: contains(github.event.schedule, '0 5 * * 0')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Post-merge verification matrix (<10 min)
        timeout-minutes: 10
        run: make post-merge-check

  # ── Weekly supply-chain audit (S18) ───────────────────────────────────────
  audit:
    if: contains(github.event.schedule, '0 5 * * 0')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit simulator dependencies
        timeout-minutes: 10
        working-directory: simulator
        run: cargo audit

  # ── Weekly TSan sweep (non-blocking race detector) ────────────────────────
  tsan:
    if: contains(github.event.schedule, '0 5 * * 0')
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        backend: [NOREC, TL2]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v5
      - name: Install LLVM 22
        run: |
          sudo wget -q -O /etc/apt/trusted.gpg.d/llvm-snapshot.asc \
            https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo add-apt-repository "deb https://apt.llvm.org/jammy/ \
            llvm-toolchain-jammy-22 main"
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev clang-22 lld make
      - name: Build TSan bank (${{ matrix.backend }})
        run: make -C benchmarks/cpp bin/bank BACKEND=${{ matrix.backend }} SANITIZE=thread
      - name: Run TSan bank (${{ matrix.backend }})
        run: ./benchmarks/cpp/bin/bank -t 4 -d 1000
      - name: Build TSan test_tx/test_ds (${{ matrix.backend }})
        run: make -C benchmarks/cpp bin/test_tx bin/test_ds BACKEND=${{ matrix.backend }} SANITIZE=thread
      - name: Run TSan test_tx/test_ds (${{ matrix.backend }})
        run: |
          ./benchmarks/cpp/bin/test_tx
          ./benchmarks/cpp/bin/test_ds

  # ── Weekly Rust coverage report (non-blocking) ────────────────────────────
  coverage:
    if: contains(github.event.schedule, '0 5 * * 0')
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Coverage — Rust workspace
        run: cargo llvm-cov --manifest-path explicit_api/rust/workspace/Cargo.toml --features wbctl -p tm -- --test-threads=1
      - name: Coverage — simulator
        run: cargo llvm-cov --manifest-path simulator/Cargo.toml
