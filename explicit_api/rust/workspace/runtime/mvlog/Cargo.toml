[package]
name = "runtime-mvlog"
version = "0.1.0"
edition = "2021"

[dependencies]
runtime-core = { path = "../core" }
serde = { version = "1", features = ["derive", "alloc"], optional = true }

[features]
simulation = ["runtime-core/simulation"]
stats = ["runtime-core/stats"]
serde = ["dep:serde", "runtime-core/serde"]
