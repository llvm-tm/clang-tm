[package]
name = "containers"
version = "0.1.0"
edition = "2021"

[dependencies]
tm = { path = "../tm", default-features = false }

# review-05 R-12: `cargo check -p containers` standalone failed because the
# tm façade requires a backend feature. Mirror bench-tinystm's pass-through;
# consumers with a different backend should use default-features = false and
# enable their own backend feature.
[features]
default = ["wbctl"]
wbctl = ["tm/wbctl"]
wbetl = ["tm/wbetl"]
wt = ["tm/wt"]
norec = ["tm/norec"]
tl2 = ["tm/tl2"]
