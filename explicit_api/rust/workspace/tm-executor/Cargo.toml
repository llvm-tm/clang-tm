[package]
name = "tm-executor"
version = "0.1.0"
edition = "2021"

[features]
default = ["wbctl"]
wbctl   = ["tm/wbctl"]
wbetl   = ["tm/wbetl"]
wt      = ["tm/wt"]
norec   = ["tm/norec"]
tl2     = ["tm/tl2"]
swisstm = ["tm/swisstm"]
dudetm  = ["tm/dudetm"]
tsxsgl  = ["tm/tsxsgl"]
nvhtm   = ["tm/nvhtm"]
spht    = ["tm/spht"]

[dependencies]
addrspace = { path = "../addrspace" }
tm = { path = "../tm", default-features = false }

[dev-dependencies]
tm = { path = "../tm", features = ["wbctl"] }
