[package]
name = "tm-des"
version = "0.1.0"
edition = "2021"
description = "Transactional Memory Discrete Event Simulator"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Real TM backend crates (simulation mode)
runtime-core = { path = "../explicit_api/rust/workspace/runtime/core", features = ["simulation", "serde", "stats"] }
runtime-norec = { path = "../explicit_api/rust/workspace/runtime/norec", features = ["simulation", "serde", "stats"] }
runtime-tl2 = { path = "../explicit_api/rust/workspace/runtime/tl2", features = ["simulation", "serde", "stats"] }
runtime-tinystm = { path = "../explicit_api/rust/workspace/runtime/tinystm", features = ["simulation", "serde", "stats", "wbctl"] }
runtime-romulus = { path = "../explicit_api/rust/workspace/runtime/romulus", features = ["simulation", "serde", "stats"] }
runtime-swisstm = { path = "../explicit_api/rust/workspace/runtime/swisstm", features = ["simulation", "serde", "stats"] }
runtime-tsx-sim = { path = "../explicit_api/rust/workspace/runtime/tsx_sim", features = ["simulation", "serde", "stats"] }
libc = "0.2"
libloading = "0.8"

[[bin]]
name = "tm-des"
path = "src/bin/tm-des.rs"

[[bin]]
name = "tm-check"
path = "src/bin/tm-check.rs"

[[bin]]
name = "tm-gen"
path = "src/bin/tm-gen.rs"

[[bin]]
name = "tm-trace2jsonl"
path = "src/bin/tm-trace2jsonl.rs"

[[bin]]
name = "tm-sim"
path = "src/bin/tm-sim.rs"

[[bin]]
name = "tm-live"
path = "src/bin/tm-live.rs"

[[bin]]
name = "tm-fix-trace"
path = "src/bin/tm-fix-trace.rs"
